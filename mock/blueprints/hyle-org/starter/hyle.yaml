    - anthropic/claude-haiku-4-5
  offline:
    - ollama/qwen2.5:14b

blueprint:
  ontology:
    - ontology/CLAUDE.md
    - ontology/glossary.md
  identities:
    - identities/AGENTS.md
  craft:
    - craft/SKILLS.md
  ethics:
    - ethics/policies.md

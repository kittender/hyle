<div class="docs-layout">
  <!-- Sidebar -->
  <div class="docs-sidebar">
    <div class="docs-sidebar-label">Documentation</div>
    @for (s of sections(); track s.id) {
      <button class="docs-nav-item" [class.active]="active() === s.id" (click)="setActive(s.id)">
        {{ s.label }}
      </button>
    }
  </div>

  <!-- Content (loaded from markdown → JSON) -->
  <div class="docs-content" #contentEl>
    <div [innerHTML]="currentContent()"></div>
  </div>
</div>

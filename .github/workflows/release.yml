name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: cli/dist/

  sign:
    name: Sign binaries with GPG
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: cli/dist/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import --passphrase "$GPG_PASSPHRASE" - || true
          echo "GPG key imported"

      - name: Compute checksums
        run: sha256sum dist/hyle-* > dist/SHA256SUMS.txt

      - name: Sign checksums and binaries
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Sign the checksums file
          gpg --batch --detach-sign --armor --passphrase "$GPG_PASSPHRASE" dist/SHA256SUMS.txt
          # Sign each binary
          for binary in dist/hyle-*; do
            gpg --batch --detach-sign --armor --passphrase "$GPG_PASSPHRASE" "$binary"
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-signed
          path: cli/dist/

  package-deb-rpm:
    name: Build .deb and .rpm packages
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: cli/dist/

      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.34.0/nfpm_2.34.0_Linux_x86_64.tar.gz | tar -xz -C /tmp/
          sudo mv /tmp/nfpm /usr/local/bin/

      - name: Build .deb packages
        run: |
          # x64
          nfpm package -f nfpm.yaml --packager deb -t dist/hyle_$(git describe --tags --abbrev=0)_amd64.deb
          # arm64 - modify nfpm.yaml on-the-fly
          sed 's/arch: amd64/arch: arm64/' nfpm.yaml | sed 's|hyle-linux-x64|hyle-linux-arm64|' > nfpm-arm64.yaml
          nfpm package -f nfpm-arm64.yaml --packager deb -t dist/hyle_$(git describe --tags --abbrev=0)_arm64.deb

      - name: Build .rpm packages
        run: |
          # x64
          nfpm package -f nfpm.yaml --packager rpm -t dist/hyle_$(git describe --tags --abbrev=0)_x86_64.rpm
          # arm64
          sed 's/arch: amd64/arch: arm64/' nfpm.yaml | sed 's|hyle-linux-x64|hyle-linux-arm64|' > nfpm-arm64.yaml
          nfpm package -f nfpm-arm64.yaml --packager rpm -t dist/hyle_$(git describe --tags --abbrev=0)_aarch64.rpm

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cli-packages
          path: cli/dist/*.{deb,rpm}

  package-snap:
    name: Build Snap package
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: cli/dist/

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        run: snapcraft --version && snapcraft -vv

      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: cli-snap
          path: cli/*.snap

  release:
    name: Create GitHub Release
    needs: [sign, package-deb-rpm, package-snap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Copy signed binaries
          cp artifacts/cli-signed/hyle-* release-assets/
          cp artifacts/cli-signed/SHA256SUMS.txt* release-assets/
          # Copy packages
          cp artifacts/cli-packages/*.deb release-assets/ 2>/dev/null || true
          cp artifacts/cli-packages/*.rpm release-assets/ 2>/dev/null || true
          # Copy snap
          cp artifacts/cli-snap/*.snap release-assets/ 2>/dev/null || true
          # List what we're releasing
          ls -lah release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Homebrew tap update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: 'kittender',
                repo: 'homebrew-hyle',
                event_type: 'new-release',
                client_payload: { version: context.ref.replace('refs/tags/', '') }
              });
              console.log('Homebrew tap update triggered');
            } catch (error) {
              console.log('Note: Homebrew tap update skipped (repo may not exist yet)');
            }

  update-scoop:
    name: Update Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scoop bucket update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: 'kittender',
                repo: 'scoop-hyle',
                event_type: 'new-release',
                client_payload: { version: context.ref.replace('refs/tags/', '') }
              });
              console.log('Scoop bucket update triggered');
            } catch (error) {
              console.log('Note: Scoop bucket update skipped (repo may not exist yet)');
            }
